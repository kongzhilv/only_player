name: 确保并审查 1.0.146 正式发布

run-name: 确保并审查 1.0.146 正式发布

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ensure-release-1.0.146.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: ensure-release-1.0.146
  cancel-in-progress: false

jobs:
  ensure-release:
    name: 触发正式发布并核验产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 校验待发布版本
        shell: bash
        run: |
          version_name=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')

          if [ "$version_name" != '1.0.146' ]; then
            echo "::error::versionName 为 ${version_name}，期望 1.0.146"
            exit 1
          fi

          if [ "$version_code" != '147' ]; then
            echo "::error::versionCode 为 ${version_code}，期望 147"
            exit 1
          fi

          echo '版本信息校验通过。'

      - name: 检查现有 Release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v1.0.146 --json assets,url > existing-release.json 2>/dev/null; then
            arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a"))] | length' existing-release.json)
            x64=$(jq '[.assets[] | select(.name | contains("x86_64"))] | length' existing-release.json)
            if [ "$arm64" -gt 0 ] && [ "$x64" -gt 0 ]; then
              echo 'complete=true' >> "$GITHUB_OUTPUT"
              echo 'v1.0.146 已存在且两个架构 APK 齐全。'
              exit 0
            fi
          fi
          echo 'complete=false' >> "$GITHUB_OUTPUT"

      - name: 触发正式发布工作流
        id: dispatch
        if: steps.existing.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yaml/dispatches" \
            -f ref='main' \
            -F 'inputs[version]=1.0.146' \
            -F 'inputs[create_release]=true'

          echo '正式发布工作流已触发。'

      - name: 获取正式发布运行编号
        id: release-run
        if: steps.existing.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          started_at='${{ steps.dispatch.outputs.started_at }}'
          run_id=''
          run_url=''

          for attempt in $(seq 1 30); do
            data=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yaml/runs?event=workflow_dispatch&branch=main&per_page=20")
            run_id=$(printf '%s' "$data" | jq -r --arg started "$started_at" \
              '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .id // empty')
            run_url=$(printf '%s' "$data" | jq -r --arg started "$started_at" \
              '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .html_url // empty')

            if [ -n "$run_id" ]; then
              break
            fi

            echo "第 ${attempt} 次等待正式发布运行出现。"
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo '::error::触发后仍未取得正式发布运行编号。'
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "正式发布运行：${run_url}"

      - name: 等待正式发布结束
        id: wait
        if: steps.existing.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          run_id='${{ steps.release-run.outputs.run_id }}'
          conclusion=''

          for attempt in $(seq 1 90); do
            data=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(printf '%s' "$data" | jq -r '.status')
            conclusion=$(printf '%s' "$data" | jq -r '.conclusion // empty')
            echo "第 ${attempt} 次检查：status=${status} conclusion=${conclusion:-等待中}"

            if [ "$status" = 'completed' ]; then
              break
            fi

            sleep 20
          done

          if [ -z "$conclusion" ]; then
            echo '::error::正式发布在等待时限内仍未结束。'
            exit 1
          fi

          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      - name: 输出正式发布失败日志
        if: steps.existing.outputs.complete != 'true' && steps.wait.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          run_id='${{ steps.release-run.outputs.run_id }}'
          echo '========== 正式发布失败日志 =========='
          gh run view "$run_id" --log-failed
          exit 1

      - name: 核验 GitHub Release 与 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            if gh release view v1.0.146 --json tagName,url,assets > release.json 2>/dev/null; then
              arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a") and endswith(".apk"))] | length' release.json)
              x64=$(jq '[.assets[] | select(.name | contains("x86_64") and endswith(".apk"))] | length' release.json)
              if [ "$arm64" -gt 0 ] && [ "$x64" -gt 0 ]; then
                jq . release.json
                echo 'v1.0.146 Release 与两个架构 APK 均已核验通过。'
                exit 0
              fi
            fi
            echo "第 ${attempt} 次等待 Release 资产就绪。"
            sleep 10
          done

          echo '::error::Release 不存在或两个架构 APK 不齐全。'
          exit 1
