name: 核验 1.0.147 正式发布

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/observe-v1.0.147-release.yml'

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  observe:
    name: 跟踪正式构建、Release 与长期签名
    runs-on: ubuntu-latest
    steps:
      - name: 定位、跟踪并核验正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OBSERVER_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          version='1.0.147'
          tag="v${version}"
          expected='b216ded82a850a9a55d885b8cbf1b8398bbd13b9c511fc3501f3595af89717b7'
          run_id=''

          normalize() {
            tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]'
          }

          verify_release() {
            rm -rf /tmp/release-check
            mkdir -p /tmp/release-check

            if ! gh release view "$tag" --repo "$repo" --json url,tagName,assets >/tmp/release.json 2>/dev/null; then
              return 1
            fi

            arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a") and endswith(".apk"))] | length' /tmp/release.json)
            x64=$(jq '[.assets[] | select(.name | contains("x86_64") and endswith(".apk"))] | length' /tmp/release.json)
            sums=$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' /tmp/release.json)
            fingerprint=$(jq '[.assets[] | select(.name == "SHA256-CERT-FINGERPRINT.txt")] | length' /tmp/release.json)
            certificate=$(jq '[.assets[] | select(.name == "only-player-fork-signing-certificate.pem")] | length' /tmp/release.json)

            if [ "$arm64" -lt 1 ] || [ "$x64" -lt 1 ] || [ "$sums" -lt 1 ] ||
               [ "$fingerprint" -lt 1 ] || [ "$certificate" -lt 1 ]; then
              return 1
            fi

            gh release download "$tag" --repo "$repo" \
              --pattern 'SHA256-CERT-FINGERPRINT.txt' \
              --dir /tmp/release-check \
              --clobber

            published=$(normalize </tmp/release-check/SHA256-CERT-FINGERPRINT.txt)
            [ "$published" = "$expected" ]
          }

          workflow_id=$(gh api "repos/${repo}/actions/workflows" \
            --jq '.workflows[] | select(.path == ".github/workflows/publish.yaml") | .id' |
            head -n 1)

          if [ -z "$workflow_id" ]; then
            echo '::error::没有找到 publish.yaml 工作流'
            exit 1
          fi

          if verify_release; then
            echo "${tag} 已经完整发布，跳过重复触发。"
          else
            run_id=$(gh api "repos/${repo}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30" \
              --jq ".workflow_runs[] | select(.display_title == \"Android 正式版发布 ${version}\") | .id" |
              head -n 1)

            if [ -z "$run_id" ]; then
              echo "尚未定位到 ${version} 正式运行，主动触发。"
              gh workflow run publish.yaml --repo "$repo" --ref main \
                -f version="$version" \
                -f create_release=true

              for attempt in $(seq 1 30); do
                run_id=$(gh api "repos/${repo}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30" \
                  --jq ".workflow_runs[] | select(.display_title == \"Android 正式版发布 ${version}\") | .id" |
                  head -n 1)
                if [ -n "$run_id" ]; then
                  break
                fi
                sleep 5
              done
            fi

            if [ -z "$run_id" ]; then
              echo '::error::正式发布已触发，但未取得运行 ID'
              exit 1
            fi

            run_url="https://github.com/${repo}/actions/runs/${run_id}"
            echo "正式运行 ID：${run_id}"
            echo "正式运行：${run_url}"

            if ! gh run watch "$run_id" --repo "$repo" --exit-status --interval 10; then
              echo '::error::正式发布工作流失败'
              gh run view "$run_id" --repo "$repo" --log-failed || true
              gh pr comment "$PR_NUMBER" --repo "$repo" --body "## v${version} 发布失败\n\n- 正式运行：${run_url}\n- 观察工作流已输出失败步骤日志，保留本 PR 以便继续修复。"
              exit 1
            fi

            for attempt in $(seq 1 30); do
              if verify_release; then
                break
              fi
              sleep 5
            done
          fi

          if ! verify_release; then
            echo '::error::正式工作流结束，但 Release 资产或长期签名核验未通过'
            exit 1
          fi

          release_url=$(jq -r '.url' /tmp/release.json)
          assets=$(jq -r '.assets[].name' /tmp/release.json | sed 's/^/- `/' | sed 's/$/`/')

          body=$(cat <<EOF
          ## v${version} 正式发行成功

          - Release：${release_url}
          - 应用 ID：`io.github.kongzhilv.onlyplayer`
          - versionCode：`148`
          - 长期签名 SHA-256：`${expected}`

          ### 已核验资产

          ${assets}

          两个架构 APK、哈希清单、签名指纹与公开证书均已存在，Release 指纹与长期签名一致。
          EOF
          )

          gh pr comment "$PR_NUMBER" --repo "$repo" --body "$body"
          gh pr close "$PR_NUMBER" --repo "$repo"
          gh api --method DELETE "repos/${repo}/git/refs/heads/${OBSERVER_BRANCH}"
          echo "已关闭观察 PR 并删除分支：${OBSERVER_BRANCH}"
