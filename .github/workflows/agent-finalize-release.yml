name: 发行前倍速修复与完整验证

run-name: 发行前倍速修复与完整验证 · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches:
      - agent/persist-manual-playback-speed

permissions:
  contents: write

jobs:
  finalize-release:
    name: 修复、测试并准备 1.0.146
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@v6
        with:
          ref: agent/persist-manual-playback-speed
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 修复全部默认倍速回退路径
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False

          repeat_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == 'Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,'
          ]
          if len(repeat_matches) != 1:
              raise SystemExit(f'重复播放分支期望命中 1 次，实际命中 {len(repeat_matches)} 次。')
          repeat_index = repeat_matches[0]
          arrow_index = repeat_index + 1
          if arrow_index >= len(lines):
              raise SystemExit('重复播放分支缺少返回值。')
          expected_old = '-> playerPreferences.defaultPlaybackSpeed'
          expected_new = '-> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed'
          if lines[arrow_index].strip() == expected_old:
              indent = lines[arrow_index][:len(lines[arrow_index]) - len(lines[arrow_index].lstrip())]
              lines[arrow_index] = indent + expected_new
              changed = True
          elif lines[arrow_index].strip() != expected_new:
              raise SystemExit(f'重复播放分支内容异常：{lines[arrow_index].strip()}')

          helper_signature = 'private fun Player.persistedPlaybackSpeedOrDefault(): Float ='
          if not any(line.strip() == helper_signature for line in lines):
              anchors = [
                  i for i, line in enumerate(lines)
                  if line.strip().startswith('private fun Player.isEndOfQueuePauseEnabled')
              ]
              if len(anchors) != 1:
                  raise SystemExit(f'倍速辅助函数插入点期望命中 1 次，实际命中 {len(anchors)} 次。')
              index = anchors[0]
              helper = [
                  '    private fun Player.persistedPlaybackSpeedOrDefault(): Float =',
                  '        currentMediaItem?.mediaMetadata?.playbackSpeed ?: playerPreferences.defaultPlaybackSpeed',
                  '',
              ]
              lines[index:index] = helper
              changed = True

          old_reset = 'player.setPlaybackSpeed(playerPreferences.defaultPlaybackSpeed)'
          new_reset = 'player.setPlaybackSpeed(player.persistedPlaybackSpeedOrDefault())'
          old_indexes = [i for i, line in enumerate(lines) if line.strip() == old_reset]
          new_count = sum(1 for line in lines if line.strip() == new_reset)
          if old_indexes:
              if len(old_indexes) != 4:
                  raise SystemExit(f'默认倍速回退语句期望命中 4 次，实际命中 {len(old_indexes)} 次。')
              for index in old_indexes:
                  indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
                  lines[index] = indent + new_reset
              changed = True
          elif new_count != 4:
              raise SystemExit(f'已修复倍速回退语句期望存在 4 次，实际存在 {new_count} 次。')

          if changed:
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('已处理空闲、结束、队列末尾和重复播放的倍速回退。')
          PY

      - name: 补全远程稳定键的倍速迁移
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/playback/PlaybackStateCoordinator.kt')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = 'if (primaryVideoState?.audioTrackIndex == null) {'
          already_present = any('fallbackVideoState.playbackSpeed?.let' in line for line in lines)
          if not already_present:
              matches = [i for i, line in enumerate(lines) if line.strip() == marker]
              if len(matches) != 1:
                  raise SystemExit(f'远程倍速迁移插入点期望命中 1 次，实际命中 {len(matches)} 次。')
              index = matches[0]
              block = [
                  '        if (primaryVideoState?.playbackSpeed == null) {',
                  '            fallbackVideoState.playbackSpeed?.let { playbackSpeed ->',
                  '                mediaRepository.updateMediumPlaybackSpeed(',
                  '                    uri = playbackStateUri,',
                  '                    playbackSpeed = playbackSpeed,',
                  '                )',
                  '            }',
                  '        }',
              ]
              lines[index:index] = block
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('已补全播放倍速向稳定播放状态键的迁移。')
          PY

      - name: 增加倍速迁移回归测试
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fake_path = Path('core/data/src/main/java/one/only/player/core/data/repository/fake/FakeMediaRepository.kt')
          fake_lines = fake_path.read_text(encoding='utf-8').splitlines()
          field = '    val updatedPlaybackSpeeds = mutableMapOf<String, Float>()'
          if field not in fake_lines:
              matches = [i for i, line in enumerate(fake_lines) if line.strip() == 'val directories = mutableListOf<Folder>()']
              if len(matches) != 1:
                  raise SystemExit(f'测试仓库字段插入点期望命中 1 次，实际命中 {len(matches)} 次。')
              fake_lines.insert(matches[0] + 1, field)

          method_matches = [
              i for i, line in enumerate(fake_lines)
              if line.strip() == 'override suspend fun updateMediumPlaybackSpeed(uri: String, playbackSpeed: Float) {'
          ]
          if len(method_matches) != 1:
              raise SystemExit(f'测试仓库倍速方法期望命中 1 次，实际命中 {len(method_matches)} 次。')
          method_index = method_matches[0]
          method_end = method_index + 1
          while method_end < len(fake_lines) and fake_lines[method_end].strip() != '}':
              method_end += 1
          if method_end >= len(fake_lines):
              raise SystemExit('测试仓库倍速方法缺少结束括号。')
          method_body = [line.strip() for line in fake_lines[method_index + 1:method_end]]
          if 'updatedPlaybackSpeeds[uri] = playbackSpeed' not in method_body:
              fake_lines[method_index + 1:method_end] = ['        updatedPlaybackSpeeds[uri] = playbackSpeed']
          fake_path.write_text('\n'.join(fake_lines) + '\n', encoding='utf-8')

          test_path = Path('feature/player/src/test/java/one/only/player/feature/player/service/playback/PlaybackStateCoordinatorTest.kt')
          test_lines = test_path.read_text(encoding='utf-8').splitlines()
          import_line = 'import kotlinx.coroutines.runBlocking'
          if import_line not in test_lines:
              package_index = next(i for i, line in enumerate(test_lines) if line.startswith('package '))
              insert_index = package_index + 1
              while insert_index < len(test_lines) and test_lines[insert_index].strip() == '':
                  insert_index += 1
              test_lines.insert(insert_index, import_line)

          test_name = 'fun migrateFallbackStateToPlaybackStateUri_copiesPlaybackSpeedWhenPrimaryMissing() = runBlocking {'
          if not any(line.strip() == test_name for line in test_lines):
              anchors = [i for i, line in enumerate(test_lines) if line.strip() == 'private fun videoState(']
              if len(anchors) != 1:
                  raise SystemExit(f'回归测试插入点期望命中 1 次，实际命中 {len(anchors)} 次。')
              index = anchors[0]
              block = [
                  '    @Test',
                  '    fun migrateFallbackStateToPlaybackStateUri_copiesPlaybackSpeedWhenPrimaryMissing() = runBlocking {',
                  '        val repository = FakeMediaRepository()',
                  '        val coordinator = PlaybackStateCoordinator(repository)',
                  '        val playbackStateUri = "remote:smb:1:/Movies/Episode.mkv"',
                  '        val primaryState = videoState(',
                  '            path = playbackStateUri,',
                  '            position = null,',
                  '            audioTrackIndex = null,',
                  '            subtitleTrackIndex = null,',
                  '            playbackSpeed = null,',
                  '            videoScale = 1f,',
                  '            subtitleDelayMilliseconds = 0L,',
                  '            subtitleSpeed = 1f,',
                  '        )',
                  '        val fallbackState = videoState(',
                  '            path = "content://media/external/video/media/42",',
                  '            position = null,',
                  '            audioTrackIndex = null,',
                  '            subtitleTrackIndex = null,',
                  '            playbackSpeed = 1.5f,',
                  '            videoScale = 1f,',
                  '            subtitleDelayMilliseconds = 0L,',
                  '            subtitleSpeed = 1f,',
                  '        )',
                  '',
                  '        coordinator.migrateFallbackStateToPlaybackStateUri(',
                  '            playbackStateUri = playbackStateUri,',
                  '            primaryVideoState = primaryState,',
                  '            fallbackVideoState = fallbackState,',
                  '        )',
                  '',
                  '        assertEquals(1.5f, repository.updatedPlaybackSpeeds[playbackStateUri] ?: 0f, 0.0001f)',
                  '    }',
                  '',
              ]
              test_lines[index:index] = block
          test_path.write_text('\n'.join(test_lines) + '\n', encoding='utf-8')
          print('已增加远程稳定键倍速迁移回归测试。')
          PY

      - name: 更新版本号与发布说明
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text(encoding='utf-8')
          if 'versionCode = 146' in gradle:
              gradle = gradle.replace('versionCode = 146', 'versionCode = 147', 1)
          elif 'versionCode = 147' not in gradle:
              raise SystemExit('当前 versionCode 不是预期的 146 或 147。')
          if 'versionName = "1.0.145"' in gradle:
              gradle = gradle.replace('versionName = "1.0.145"', 'versionName = "1.0.146"', 1)
          elif 'versionName = "1.0.146"' not in gradle:
              raise SystemExit('当前 versionName 不是预期的 1.0.145 或 1.0.146。')
          gradle_path.write_text(gradle, encoding='utf-8')

          changelog = '''- 修复手动设置的播放倍速在播放结束、播放器重新准备或重复播放时回到 1 倍的问题
- 普通倍速会保存到当前视频，并在再次打开视频时恢复
- 长按临时倍速继续保持独立，不会覆盖已保存的普通倍速
- 补全远程视频稳定播放状态键的倍速迁移
- 重写中文 README，并补充中文 GitHub Actions 与发布说明

<details>
<summary>English Version</summary>

- Fix manually selected playback speed reverting to 1x after playback ends, player re-preparation, or repeated playback
- Persist normal playback speed per video and restore it when the video is opened again
- Keep long-press temporary speed independent from the saved normal speed
- Migrate playback speed to stable playback-state keys for remote videos
- Rewrite the Chinese README and document GitHub Actions and release usage

</details>
'''
          Path('.github/CHANGELOG.md').write_text(changelog, encoding='utf-8')
          print('版本已更新为 1.0.146，更新日志已写入。')
          PY

      - name: 格式化、测试并编译 Debug APK
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug --warning-mode=fail

      - name: 检查最终修改范围
        shell: bash
        run: |
          allowed='^(app/build.gradle.kts|\.github/CHANGELOG.md|\.github/workflows/agent-finalize-release.yml|core/data/src/main/java/one/only/player/core/data/repository/fake/FakeMediaRepository.kt|feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt|feature/player/src/main/java/one/only/player/feature/player/service/playback/PlaybackStateCoordinator.kt|feature/player/src/test/java/one/only/player/feature/player/service/playback/PlaybackStateCoordinatorTest.kt)$'
          unexpected=$(git diff --name-only | grep -v -E "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo '发现超出允许范围的修改文件：'
            echo "$unexpected"
            exit 1
          fi
          echo '最终修改范围检查通过。'

      - name: 清理临时工作流并提交发行候选
        shell: bash
        run: |
          rm .github/workflows/agent-finalize-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '发行：完成 1.0.146 倍速修复与验证'
          git push origin HEAD:agent/persist-manual-playback-speed
