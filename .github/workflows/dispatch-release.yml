name: 触发并报告 1.0.146 正式发布运行

run-name: 触发并报告 1.0.146 正式发布运行

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  dispatch:
    name: 查找正式发布工作流并触发
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 查找并触发正式发布
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          workflows=$(gh workflow list --all --json id,name,path,state)
          workflow_id=$(printf '%s' "$workflows" | jq -r '.[] | select(.path == ".github/workflows/publish.yaml") | .id' | head -n 1)
          if [ -z "$workflow_id" ]; then
            echo '::error::publish.yaml 仍未注册为可运行工作流。'
            printf '%s\n' "$workflows"
            exit 1
          fi

          echo "正式发布工作流 ID：${workflow_id}"
          gh workflow run "$workflow_id" --ref main -f version='1.0.146' -f create_release=true
          sleep 15

          run_id=$(gh run list --workflow "$workflow_id" --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId // empty')
          if [ -z "$run_id" ]; then
            echo '::error::已触发但尚未查询到正式发布运行。'
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "正式发布运行 ID：${run_id}"

      - name: 将发布运行 ID 写入 PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/dispatch.md" <<EOF
          ## 1.0.146 正式发布已触发

          - 触发器运行 ID：${GITHUB_RUN_ID}
          - 正式发布运行 ID：${{ steps.release.outputs.run_id }}
          EOF
          gh pr comment 2 --body-file "${RUNNER_TEMP}/dispatch.md"

      - name: 清理发布触发工作流
        if: always()
        shell: bash
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/dispatch-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/dispatch-release.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'CI：清理 1.0.146 发布触发工作流'
          git push origin HEAD:main
