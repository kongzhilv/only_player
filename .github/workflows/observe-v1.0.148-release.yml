name: 核验 1.0.148 正式发布

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/observe-v1.0.148-release.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: observe-v1.0.148-release
  cancel-in-progress: true

jobs:
  observe:
    name: 核验 Release 资产与长期签名
    runs-on: ubuntu-latest
    steps:
      - name: 轮询并核验正式发行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          pr_number='14'
          version='1.0.148'
          tag="v${version}"
          expected='b216ded82a850a9a55d885b8cbf1b8398bbd13b9c511fc3501f3595af89717b7'

          normalize() {
            tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]'
          }

          verify_release() {
            rm -rf /tmp/release-check
            mkdir -p /tmp/release-check

            if ! gh release view "$tag" --repo "$repo" --json url,tagName,assets >/tmp/release.json 2>/dev/null; then
              return 1
            fi

            arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a") and endswith(".apk"))] | length' /tmp/release.json)
            x64=$(jq '[.assets[] | select(.name | contains("x86_64") and endswith(".apk"))] | length' /tmp/release.json)
            sums=$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' /tmp/release.json)
            fingerprint=$(jq '[.assets[] | select(.name == "SHA256-CERT-FINGERPRINT.txt")] | length' /tmp/release.json)
            certificate=$(jq '[.assets[] | select(.name == "only-player-fork-signing-certificate.pem")] | length' /tmp/release.json)

            if [ "$arm64" -ne 1 ] || [ "$x64" -ne 1 ] || [ "$sums" -ne 1 ] ||
               [ "$fingerprint" -ne 1 ] || [ "$certificate" -ne 1 ]; then
              return 1
            fi

            gh release download "$tag" --repo "$repo" \
              --pattern 'SHA256-CERT-FINGERPRINT.txt' \
              --dir /tmp/release-check \
              --clobber >/dev/null

            published=$(normalize </tmp/release-check/SHA256-CERT-FINGERPRINT.txt)
            [ "$published" = "$expected" ]
          }

          gh pr comment "$pr_number" --repo "$repo" --body "v${version} 最终发行核验已启动：正在检查双架构 APK、哈希清单、公开证书和长期签名。"

          if ! verify_release; then
            workflow_id=$(gh api "repos/${repo}/actions/workflows" \
              --jq '.workflows[] | select(.path == ".github/workflows/publish.yaml") | .id' |
              head -n 1)

            run_id=$(gh api "repos/${repo}/actions/workflows/${workflow_id}/runs?branch=main&event=workflow_dispatch&per_page=30" \
              --jq ".workflow_runs[] | select(.display_title == \"Android 正式版发布 ${version}\") | .id" |
              head -n 1)

            if [ -z "$run_id" ]; then
              gh workflow run publish.yaml --repo "$repo" --ref main \
                -f version="$version" \
                -f create_release=true
              echo "已补触发 ${version} 正式发布。"
            else
              echo "已定位正式发布运行：${run_id}"
            fi

            for attempt in $(seq 1 180); do
              if verify_release; then
                break
              fi
              sleep 5
            done
          fi

          if ! verify_release; then
            latest_run=$(gh api "repos/${repo}/actions/workflows/publish.yaml/runs?branch=main&event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.display_title == \"Android 正式版发布 ${version}\") | {id,status,conclusion,html_url}" |
              head -n 1 || true)
            gh pr comment "$pr_number" --repo "$repo" --body "## v${version} 最终核验失败

15 分钟内未发现资产完整且长期签名正确的 Release。

最新正式运行：${latest_run}"
            exit 1
          fi

          release_url=$(jq -r '.url' /tmp/release.json)
          assets=$(jq -r '.assets[].name' /tmp/release.json | sed 's/^/- /')

          body=$(cat <<EOF
          ## v${version} 正式发行成功

          - Release：${release_url}
          - 应用 ID：io.github.kongzhilv.onlyplayer
          - versionCode：149
          - 长期签名 SHA-256：${expected}

          ### 已核验资产

          ${assets}

          两个架构 APK、哈希清单、签名指纹与公开证书均已存在，Release 指纹与长期签名一致。
          EOF
          )

          gh pr comment "$pr_number" --repo "$repo" --body "$body"
          gh api --method DELETE "repos/${repo}/git/refs/heads/agent/restore-list-last-played-highlight" || true
          gh api --method DELETE "repos/${repo}/git/refs/heads/agent/observe-v1.0.148-release" || true

          workflow_sha=$(gh api "repos/${repo}/contents/.github/workflows/observe-v1.0.148-release.yml?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$workflow_sha" ]; then
            gh api --method DELETE "repos/${repo}/contents/.github/workflows/observe-v1.0.148-release.yml" \
              -f message='CI：清理 v1.0.148 一次性发行观察器' \
              -f sha="$workflow_sha" \
              -f branch='main'
          fi
