name: 审查并确保 1.0.146 正式发布

run-name: 审查并确保 1.0.146 正式发布

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: ensure-release-v2-1.0.146
  cancel-in-progress: true

jobs:
  ensure:
    name: 定位正式发布工作流、跟踪结果并清理
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 校验包名与版本
        shell: bash
        run: |
          application_id=$(grep -m1 'applicationId = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_name=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')
          test "$application_id" = 'one.only.player' || { echo "::error::包名异常：${application_id}"; exit 1; }
          test "$version_name" = '1.0.146' || { echo "::error::版本名称异常：${version_name}"; exit 1; }
          test "$version_code" = '147' || { echo "::error::版本号异常：${version_code}"; exit 1; }
          echo '包名和版本校验通过。'

      - name: 解析正式发布工作流 ID
        id: workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          workflows=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/actions/workflows?per_page=100")
          workflow_id=$(printf '%s' "$workflows" | jq -r '.workflows[] | select(.path == ".github/workflows/publish.yaml") | .id' | head -n 1)
          if [ -z "$workflow_id" ]; then
            echo '::error::未找到 .github/workflows/publish.yaml 对应的工作流 ID。'
            exit 1
          fi
          echo "workflow_id=${workflow_id}" >> "$GITHUB_OUTPUT"
          echo "正式发布工作流 ID：${workflow_id}"

      - name: 等待自动发布或主动触发
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          workflow_id='${{ steps.workflow.outputs.workflow_id }}'
          start_epoch=$(date -u +%s)
          since_epoch=$((start_epoch - 90))
          run_id=''

          for attempt in $(seq 1 24); do
            runs=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/workflows/${workflow_id}/runs?branch=main&per_page=20")
            run_id=$(printf '%s' "$runs" | jq -r --argjson since "$since_epoch" '
              [.workflow_runs[] | select((.created_at | fromdateiso8601) >= $since)]
              | sort_by(.created_at)
              | last
              | .id // empty
            ')
            if [ -n "$run_id" ]; then
              echo "自动发布运行已出现：${run_id}"
              break
            fi
            echo "第 ${attempt} 次等待自动发布运行。"
            sleep 15
          done

          if [ -z "$run_id" ]; then
            echo '自动发布运行未出现，现主动触发正式发布。'
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/workflows/${workflow_id}/dispatches" \
              -d '{"ref":"main","inputs":{"version":"1.0.146","create_release":"true"}}'

            for attempt in $(seq 1 20); do
              sleep 10
              runs=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/actions/workflows/${workflow_id}/runs?event=workflow_dispatch&branch=main&per_page=20")
              run_id=$(printf '%s' "$runs" | jq -r --argjson since "$since_epoch" '
                [.workflow_runs[] | select((.created_at | fromdateiso8601) >= $since)]
                | sort_by(.created_at)
                | last
                | .id // empty
              ')
              if [ -n "$run_id" ]; then
                echo "主动触发的发布运行已出现：${run_id}"
                break
              fi
            done
          fi

          if [ -z "$run_id" ]; then
            echo '::error::正式发布运行未创建。'
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "since_epoch=${since_epoch}" >> "$GITHUB_OUTPUT"

      - name: 跟踪正式发布运行
        id: track
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          workflow_id='${{ steps.workflow.outputs.workflow_id }}'
          run_id='${{ steps.locate.outputs.run_id }}'
          since_epoch='${{ steps.locate.outputs.since_epoch }}'
          conclusion=''
          run_url=''

          for attempt in $(seq 1 90); do
            data=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/runs/${run_id}")
            status=$(printf '%s' "$data" | jq -r '.status')
            conclusion=$(printf '%s' "$data" | jq -r '.conclusion // ""')
            run_url=$(printf '%s' "$data" | jq -r '.html_url // ""')
            echo "第 ${attempt} 次检查：run=${run_id} status=${status} conclusion=${conclusion:-等待中}"

            if [ "$status" = 'completed' ] && [ "$conclusion" = 'cancelled' ]; then
              runs=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/actions/workflows/${workflow_id}/runs?branch=main&per_page=20")
              newer=$(printf '%s' "$runs" | jq -r --argjson since "$since_epoch" --argjson current "$run_id" '
                [.workflow_runs[] | select((.created_at | fromdateiso8601) >= $since and .id != $current)]
                | sort_by(.created_at)
                | last
                | .id // empty
              ')
              if [ -n "$newer" ]; then
                echo "当前运行被并发策略取消，改为跟踪更新运行：${newer}"
                run_id="$newer"
                continue
              fi
            fi

            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 20
          done

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
          if [ -z "$conclusion" ]; then
            echo '::error::正式发布在等待时限内仍未结束。'
            exit 1
          fi

      - name: 检查 Release 和两个架构 APK
        id: release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          complete='false'
          release_url=''
          arm64='0'
          x64='0'
          if gh release view v1.0.146 --json url,assets > "${RUNNER_TEMP}/release.json" 2>/dev/null; then
            release_url=$(jq -r '.url // ""' "${RUNNER_TEMP}/release.json")
            arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a"))] | length' "${RUNNER_TEMP}/release.json")
            x64=$(jq '[.assets[] | select(.name | contains("x86_64"))] | length' "${RUNNER_TEMP}/release.json")
            if [ "$arm64" -gt 0 ] && [ "$x64" -gt 0 ]; then
              complete='true'
            fi
          fi
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          echo "release_url=${release_url}" >> "$GITHUB_OUTPUT"
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
          echo "x64=${x64}" >> "$GITHUB_OUTPUT"

      - name: 将发布审查结果写入 PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          run_id='${{ steps.track.outputs.run_id }}'
          conclusion='${{ steps.track.outputs.conclusion }}'
          run_url='${{ steps.track.outputs.run_url }}'
          complete='${{ steps.release.outputs.complete }}'
          report="${RUNNER_TEMP}/release-v2-report.md"
          {
            echo '## Only Player v1.0.146 发布审查结果（第二轮）'
            echo
            echo "- 正式发布运行：${run_url:-未取得}"
            echo "- 运行 ID：${run_id:-无}"
            echo "- 运行结论：${conclusion:-未取得}"
            echo "- Release：${{ steps.release.outputs.release_url }}"
            echo "- arm64-v8a APK：$([ '${{ steps.release.outputs.arm64 }}' -gt 0 ] && echo '存在' || echo '缺失')"
            echo "- x86_64 APK：$([ '${{ steps.release.outputs.x64 }}' -gt 0 ] && echo '存在' || echo '缺失')"
            echo
          } > "$report"

          if [ "$complete" != 'true' ] && [ -n "$run_id" ]; then
            echo '### 正式发布失败日志末尾' >> "$report"
            echo '```text' >> "$report"
            gh run view "$run_id" --log-failed 2>&1 | tail -n 220 >> "$report" || true
            echo '```' >> "$report"
          fi
          gh pr comment 2 --body-file "$report"
          cat "$report"

      - name: 清理第二轮一次性发布审查工作流
        if: always()
        shell: bash
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/ensure-release-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ensure-release-v2.yml
          if git diff --cached --quiet; then
            echo '第二轮一次性工作流已被其他任务清理。'
            exit 0
          fi
          git commit -m 'CI：清理第二轮 1.0.146 发布审查工作流'
          git push origin HEAD:main

      - name: 确认正式发布完成
        if: steps.release.outputs.complete != 'true'
        shell: bash
        run: |
          echo '::error::v1.0.146 Release 或两个架构 APK 尚未完整生成，详情已写入 PR #2 评论。'
          exit 1
