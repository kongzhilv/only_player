name: 触发 Only Player 1.0.146 正式发布

run-name: 触发 Only Player 1.0.146 正式发布

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  trigger-release:
    name: 校验并触发正式发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 校验版本与标签
        id: check
        shell: bash
        run: |
          version=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          expected_version='1.0.146'
          tag="v${expected_version}"

          if [ "$version" != "$expected_version" ]; then
            echo "::error::当前 versionName 为 ${version}，期望 ${expected_version}"
            exit 1
          fi

          git fetch --tags --force
          if git tag -l "$tag" | grep -q .; then
            echo "标签 ${tag} 已存在，跳过重复触发。"
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
          else
            echo "版本与标签状态校验通过，准备触发 ${tag}。"
            echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Android 正式版发布
        if: steps.check.outputs.should_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh workflow run publish.yaml \
            --ref main \
            -f version='1.0.146' \
            -f create_release=true
          echo '已提交 Android 正式版发布任务。'

      - name: 清理一次性发布触发器
        if: success()
        shell: bash
        run: |
          rm .github/workflows/trigger-release-1.0.146.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trigger-release-1.0.146.yml
          git commit -m 'CI：清理 1.0.146 一次性发布触发器'
          git push origin HEAD:main
