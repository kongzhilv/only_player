name: 倍速修复最终审查

run-name: 倍速修复最终审查 · ${{ github.ref_name }}

on:
  push:
    branches:
      - agent/finalize-speed-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: 修正倍速持久化并完成验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@v6
        with:
          ref: agent/finalize-speed-release
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 修正倍速保存与切换回退
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          text = path.read_text(encoding='utf-8')

          old_transition = '''        Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed

              else -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed
          }'''
          new_transition = '''        Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> storedPlaybackSpeed ?: currentPlaybackSpeed

              else -> storedPlaybackSpeed ?: currentPlaybackSpeed
          }'''

          if old_transition in text:
              text = text.replace(old_transition, new_transition, 1)
          elif '-> storedPlaybackSpeed ?: currentPlaybackSpeed' not in text:
              pattern = re.compile(
                  r'''        Player\.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,\n\s*-> storedPlaybackSpeed \?: playerPreferences\.defaultPlaybackSpeed\n\n\s*Player\.MEDIA_ITEM_TRANSITION_REASON_REPEAT,\n\s*-> storedPlaybackSpeed \?: playerPreferences\.defaultPlaybackSpeed\n\n\s*else -> storedPlaybackSpeed \?: playerPreferences\.defaultPlaybackSpeed'''
              )
              text, count = pattern.subn(
                  '''        Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
                  Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
                  -> storedPlaybackSpeed ?: currentPlaybackSpeed

                  else -> storedPlaybackSpeed ?: currentPlaybackSpeed''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'倍速切换回退逻辑期望修改 1 处，实际修改 {count} 处。')

          persistent_pattern = re.compile(
              r'''(CustomCommands\.SET_PERSISTENT_PLAYBACK_SPEED -> \{\n\s*val playbackSpeed = args\.getFloat\(CustomCommands\.PLAYBACK_SPEED_KEY\)\n\s*val player = mediaSession\?\.player\n\s*\?: return@future SessionResult\(SessionError\.ERROR_BAD_VALUE\)\n\s*val currentMediaItem = player\.currentMediaItem\n\s*\?: return@future SessionResult\(SessionError\.ERROR_BAD_VALUE\)\n\n\s*player\.setPlaybackSpeed\(playbackSpeed\)\n)\s*serviceScope\.launch \{\n\s*val playbackStateUri = playbackStateCoordinator\.resolvePlaybackStateUri\(currentMediaItem\)\n\s*mediaRepository\.updateMediumPlaybackSpeed\(\n\s*uri = playbackStateUri,\n\s*playbackSpeed = playbackSpeed,\n\s*\)\n\s*\}\n'''
          )
          replacement = r'''\1                    val playbackStateUri = playbackStateCoordinator.resolvePlaybackStateUri(currentMediaItem)
                      mediaRepository.updateMediumPlaybackSpeed(
                          uri = playbackStateUri,
                          playbackSpeed = playbackSpeed,
                      )
'''
          text, count = persistent_pattern.subn(replacement, text, count=1)
          if count == 0:
              block_start = text.find('CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {')
              block_end = text.find('CustomCommands.SET_TRANSIENT_PLAYBACK_SPEED -> {', block_start)
              if block_start < 0 or block_end < 0:
                  raise SystemExit('未找到持久倍速命令代码块。')
              block = text[block_start:block_end]
              if 'serviceScope.launch {' in block:
                  raise SystemExit('持久倍速保存仍包含异步 launch，但自动定位未成功。')
              if 'mediaRepository.updateMediumPlaybackSpeed(' not in block:
                  raise SystemExit('持久倍速命令缺少数据库写入。')

          path.write_text(text, encoding='utf-8')
          print('倍速保存与切换回退已修正。')
          PY

      - name: 删除重复发行工作流
        shell: bash
        run: |
          rm -f .github/workflows/release-1.0.146.yml
          echo '已移除与正式 publish.yaml 重复的发行工作流。'

      - name: 格式化、测试并编译 Debug APK
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug --warning-mode=fail

      - name: 审查修改范围
        shell: bash
        run: |
          allowed='^(feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt|\.github/workflows/release-1.0.146.yml|\.github/workflows/finalize-speed-release.yml)$'
          unexpected=$(git diff --name-only | grep -v -E "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo '发现超出允许范围的修改文件：'
            echo "$unexpected"
            exit 1
          fi
          echo '修改范围检查通过。'

      - name: 清理临时工作流并提交修复
        shell: bash
        run: |
          rm -f .github/workflows/finalize-speed-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修复：完成倍速持久化与发行流程收尾'
          git push origin HEAD:agent/finalize-speed-release
