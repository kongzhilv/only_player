name: 倍速修复最终审查

run-name: 倍速修复最终审查 · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches:
      - agent/finalize-speed-release
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: 修正倍速持久化并完成验证
    if: (github.event_name == 'push' && github.ref_name == 'agent/finalize-speed-release') || github.head_ref == 'agent/finalize-speed-release'
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@v6
        with:
          ref: agent/finalize-speed-release
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 修正倍速保存与切换回退
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          text = path.read_text(encoding='utf-8')

          transition_pattern = re.compile(
              r'''        Player\.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,\n\s*-> storedPlaybackSpeed \?: playerPreferences\.defaultPlaybackSpeed\n\n\s*Player\.MEDIA_ITEM_TRANSITION_REASON_REPEAT,\n\s*-> storedPlaybackSpeed \?: playerPreferences\.defaultPlaybackSpeed\n\n\s*else -> storedPlaybackSpeed \?: playerPreferences\.defaultPlaybackSpeed'''
          )
          transition_replacement = '''        Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> storedPlaybackSpeed ?: currentPlaybackSpeed

              else -> storedPlaybackSpeed ?: currentPlaybackSpeed'''
          text, transition_count = transition_pattern.subn(transition_replacement, text, count=1)
          if transition_count == 0 and text.count('-> storedPlaybackSpeed ?: currentPlaybackSpeed') < 2:
              raise SystemExit('未能唯一定位播放切换倍速回退逻辑。')

          command_start = text.find('CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {')
          command_end = text.find('CustomCommands.SET_TRANSIENT_PLAYBACK_SPEED -> {', command_start)
          if command_start < 0 or command_end < 0:
              raise SystemExit('未找到持久倍速命令代码块。')

          command = text[command_start:command_end]
          launch_pattern = re.compile(
              r'''\s*serviceScope\.launch \{\n\s*val playbackStateUri = playbackStateCoordinator\.resolvePlaybackStateUri\(currentMediaItem\)\n\s*mediaRepository\.updateMediumPlaybackSpeed\(\n\s*uri = playbackStateUri,\n\s*playbackSpeed = playbackSpeed,\n\s*\)\n\s*\}\n'''
          )
          direct_write = '''
                      val playbackStateUri = playbackStateCoordinator.resolvePlaybackStateUri(currentMediaItem)
                      mediaRepository.updateMediumPlaybackSpeed(
                          uri = playbackStateUri,
                          playbackSpeed = playbackSpeed,
                      )
'''
          command, launch_count = launch_pattern.subn(direct_write, command, count=1)
          if launch_count == 0:
              if 'serviceScope.launch {' in command:
                  raise SystemExit('持久倍速保存仍为异步写入，但自动替换未成功。')
              if 'mediaRepository.updateMediumPlaybackSpeed(' not in command:
                  raise SystemExit('持久倍速命令缺少数据库写入。')

          text = text[:command_start] + command + text[command_end:]
          path.write_text(text, encoding='utf-8')
          print('已消除倍速保存竞态，并修正无独立记录时的切换回退。')
          PY

      - name: 恢复正式测试发布链并删除重复发行工作流
        shell: bash
        run: |
          git checkout 23ce56838ad14e19073726045cda88e86e6d9d24 -- .github/workflows/test.yaml
          rm -f .github/workflows/release-1.0.146.yml
          echo '已恢复正式 test.yaml + publish.yaml 发布结构，并移除重复发行工作流。'

      - name: 格式化、测试并编译 Debug APK
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug --warning-mode=fail

      - name: 审查修改范围
        shell: bash
        run: |
          allowed='^(feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt|\.github/workflows/test.yaml|\.github/workflows/release-1.0.146.yml|\.github/workflows/finalize-speed-release.yml)$'
          unexpected=$(git diff --name-only | grep -v -E "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo '发现超出允许范围的修改文件：'
            echo "$unexpected"
            exit 1
          fi
          echo '修改范围检查通过。'

      - name: 清理临时工作流并提交修复
        shell: bash
        run: |
          rm -f .github/workflows/finalize-speed-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修复：完成倍速持久化与发行流程收尾'
          git push origin HEAD:agent/finalize-speed-release
