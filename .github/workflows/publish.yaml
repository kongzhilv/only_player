name: Android 正式版发布

run-name: Android 正式版发布 ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 1.0.146'
        required: false
        type: string
      create_release:
        description: '是否创建 GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: only-player-fork-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建、签名、审查并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 解析并校验发布信息
        id: release
        shell: bash
        run: |
          application_id=$(grep -m1 'applicationId = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_name=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')

          if [ -n "${{ github.event.inputs.version }}" ]; then
            release_version='${{ github.event.inputs.version }}'
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF#refs/tags/v}"
          else
            echo '::error::缺少发布版本号'
            exit 1
          fi

          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::发布版本号格式错误：$release_version"
            exit 1
          fi
          if [ "$application_id" != 'io.github.kongzhilv.onlyplayer' ]; then
            echo "::error::应用 ID 错误：$application_id"
            exit 1
          fi
          if [ "$release_version" != "$version_name" ]; then
            echo "::error::发布版本 $release_version 与 versionName $version_name 不一致"
            exit 1
          fi

          tag="v${release_version}"
          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "应用 ID：$application_id"
          echo "版本：$release_version ($version_code)"
          echo "标签：$tag"

      - name: 检查是否已经完整发布
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='${{ steps.release.outputs.tag }}'
          if ! gh release view "$tag" --json assets >/tmp/release.json 2>/dev/null; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a"))] | length' /tmp/release.json)
          x64=$(jq '[.assets[] | select(.name | contains("x86_64"))] | length' /tmp/release.json)
          if [ "$arm64" -gt 0 ] && [ "$x64" -gt 0 ]; then
            echo '完整 Release 已存在，跳过重复构建。'
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Release 不完整，将重新构建并覆盖资产。'
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 执行格式和单元测试
        if: steps.existing.outputs.complete != 'true'
        shell: bash
        run: ./gradlew ktlintCheck test --warning-mode=fail

      - name: 生成本次独立签名
        if: steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          alias='only-player-fork'
          keystore="${RUNNER_TEMP}/only-player-fork.p12"
          echo "::add-mask::$password"

          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -dname 'CN=kongzhilv Only Player Fork, OU=Release, O=kongzhilv, L=Taipei, ST=Taiwan, C=TW'

          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: 构建两个架构的正式 APK
        if: steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          python scripts/build.py build-apk --abi arm64-v8a --clean
          python scripts/build.py build-apk --abi x86_64
          ls -lh build/apk

      - name: 审查 APK、包名和签名
        if: steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          version='${{ steps.release.outputs.version }}'
          arm64=$(find build/apk -maxdepth 1 -type f -name "*-arm64-v8a-${version}.apk" -print -quit)
          x64=$(find build/apk -maxdepth 1 -type f -name "*-x86_64-${version}.apk" -print -quit)

          if [ -z "$arm64" ] || [ -z "$x64" ]; then
            echo '::error::两个架构的 APK 未完整生成'
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo '::error::未找到 apksigner'
            exit 1
          fi

          for apk in "$arm64" "$x64"; do
            "$apksigner" verify --verbose --print-certs "$apk"
            badging=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            package_name=$($badging dump badging "$apk" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)
            if [ "$package_name" != 'io.github.kongzhilv.onlyplayer' ]; then
              echo "::error::$apk 的包名错误：$package_name"
              exit 1
            fi
          done

          arm_digest=$($apksigner verify --print-certs "$arm64" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          x64_digest=$($apksigner verify --print-certs "$x64" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [ -z "$arm_digest" ] || [ "$arm_digest" != "$x64_digest" ]; then
            echo '::error::两个 APK 的签名证书不一致'
            exit 1
          fi

          keytool -exportcert -rfc \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file build/apk/only-player-fork-signing-certificate.pem

          printf '%s\n' "$arm_digest" > build/apk/SHA256-CERT-FINGERPRINT.txt
          sha256sum "$arm64" "$x64" > build/apk/SHA256SUMS.txt

          echo "arm64_apk=$arm64" >> "$GITHUB_ENV"
          echo "x64_apk=$x64" >> "$GITHUB_ENV"
          echo "certificate_sha256=$arm_digest" >> "$GITHUB_ENV"

      - name: 生成发布说明
        if: steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          cat .github/CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<EOF

          ## 构建信息

          - 应用 ID：`io.github.kongzhilv.onlyplayer`
          - versionName：`${{ steps.release.outputs.version }}`
          - versionCode：`${{ steps.release.outputs.version_code }}`
          - 签名证书 SHA-256：`${certificate_sha256}`
          - 架构：`arm64-v8a`、`x86_64`

          此版本使用独立应用 ID 和独立签名，可与原作者版本同时安装；它不会覆盖原作者签名的 `one.only.player`。
          EOF

      - name: 创建 GitHub Release
        if: steps.existing.outputs.complete != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: Only Player Fork ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            ${{ env.arm64_apk }}
            ${{ env.x64_apk }}
            build/apk/SHA256SUMS.txt
            build/apk/SHA256-CERT-FINGERPRINT.txt
            build/apk/only-player-fork-signing-certificate.pem

      - name: 最终核验 Release 资产
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='${{ steps.release.outputs.tag }}'
          gh release view "$tag" --json url,tagName,assets > /tmp/final-release.json
          cat /tmp/final-release.json

          arm64=$(jq '[.assets[] | select(.name | contains("arm64-v8a"))] | length' /tmp/final-release.json)
          x64=$(jq '[.assets[] | select(.name | contains("x86_64"))] | length' /tmp/final-release.json)
          sums=$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' /tmp/final-release.json)
          cert=$(jq '[.assets[] | select(.name == "only-player-fork-signing-certificate.pem")] | length' /tmp/final-release.json)

          if [ "$arm64" -lt 1 ] || [ "$x64" -lt 1 ] || [ "$sums" -lt 1 ] || [ "$cert" -lt 1 ]; then
            echo '::error::Release 资产核验失败'
            exit 1
          fi

          echo '✅ Release 与两个架构 APK 已完整发布。'
