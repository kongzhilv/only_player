name: Only Player 1.0.146 正式发布

run-name: Only Player 1.0.146 正式发布

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: only-player-1.0.146-release
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备 1.0.146 发布信息
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 校验版本与标签
        id: check
        shell: bash
        run: |
          version=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')
          expected_version='1.0.146'
          expected_code='147'
          tag="v${expected_version}"

          if [ "$version" != "$expected_version" ]; then
            echo "::error::versionName 为 ${version}，期望 ${expected_version}"
            exit 1
          fi

          if [ "$version_code" != "$expected_code" ]; then
            echo "::error::versionCode 为 ${version_code}，期望 ${expected_code}"
            exit 1
          fi

          git fetch --tags --force
          if git tag -l "$tag" | grep -q .; then
            echo "标签 ${tag} 已存在，本次跳过重复发布。"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "版本与标签检查通过，准备发布 ${tag}。"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${expected_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: 验证签名配置
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for key in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::缺少必需 Secret：${key}"
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "签名配置校验通过。"

      - name: 读取发布说明
        id: notes
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          if [ ! -f .github/CHANGELOG.md ]; then
            echo "::error::缺少 .github/CHANGELOG.md"
            exit 1
          fi

          cp .github/CHANGELOG.md release_notes.md
          release_notes=$(base64 -w 0 release_notes.md)
          echo "release_notes=${release_notes}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建正式版（${{ matrix.abi }}）
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 准备签名文件
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keystore_path="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "keystore_path=${keystore_path}" >> "$GITHUB_OUTPUT"

      - name: 构建已签名正式版
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python scripts/build.py build-apk --abi ${{ matrix.abi }} --clean

      - name: 校验 APK
        shell: bash
        run: |
          apk="build/apk/Only-Player-${{ matrix.abi }}-${{ needs.prepare.outputs.version }}.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::缺少构建产物：${apk}"
            exit 1
          fi
          echo "APK 校验通过：${apk}"

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: Only-Player-${{ needs.prepare.outputs.version }}-${{ matrix.abi }}
          path: build/apk/Only-Player-${{ matrix.abi }}-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 下载两个架构的 APK
        uses: actions/download-artifact@v8
        with:
          pattern: Only-Player-${{ needs.prepare.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: 校验发布文件
        shell: bash
        run: |
          arm64="release/Only-Player-arm64-v8a-${{ needs.prepare.outputs.version }}.apk"
          x64="release/Only-Player-x86_64-${{ needs.prepare.outputs.version }}.apk"

          if [ ! -f "$arm64" ]; then
            echo "::error::缺少 arm64-v8a APK：${arm64}"
            exit 1
          fi

          if [ ! -f "$x64" ]; then
            echo "::error::缺少 x86_64 APK：${x64}"
            exit 1
          fi

          echo "两个架构的 APK 均已准备完成。"

      - name: 写入发布说明
        shell: bash
        run: |
          printf '%s' '${{ needs.prepare.outputs.release_notes }}' | base64 --decode > release_notes.md

      - name: 创建标签与 GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: main
          name: Only Player ${{ needs.prepare.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/Only-Player-arm64-v8a-${{ needs.prepare.outputs.version }}.apk
            release/Only-Player-x86_64-${{ needs.prepare.outputs.version }}.apk
