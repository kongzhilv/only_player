name: 诊断并触发 1.0.146 正式发布

run-name: 诊断并触发 1.0.146 正式发布

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: diagnose-release-1.0.146
  cancel-in-progress: true

jobs:
  diagnose:
    name: 输出自身运行 ID、诊断 Actions 接口并触发发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出主分支
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: 公布诊断运行 ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/start.md" <<EOF
          ## 1.0.146 发布诊断已启动

          - 诊断运行 ID：${GITHUB_RUN_ID}
          - 仓库：${GITHUB_REPOSITORY}
          - 提交：${GITHUB_SHA}
          EOF
          gh pr comment 2 --body-file "${RUNNER_TEMP}/start.md"

      - name: 诊断工作流查询与发布触发
        id: diagnose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          output="${RUNNER_TEMP}/diagnose.txt"
          : > "$output"

          echo '===== gh auth status =====' >> "$output"
          gh auth status >> "$output" 2>&1
          echo "退出码：$?" >> "$output"

          echo >> "$output"
          echo '===== gh workflow list =====' >> "$output"
          workflows=$(gh workflow list --all --json id,name,path,state 2>&1)
          workflow_list_code=$?
          printf '%s\n' "$workflows" >> "$output"
          echo "退出码：${workflow_list_code}" >> "$output"

          workflow_id=$(printf '%s' "$workflows" | jq -r '.[]? | select(.path == ".github/workflows/publish.yaml") | .id' 2>/dev/null | head -n 1)
          echo "解析到的 publish.yaml 工作流 ID：${workflow_id:-无}" >> "$output"

          echo >> "$output"
          echo '===== REST list workflows =====' >> "$output"
          curl --silent --show-error --write-out '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" >> "$output" 2>&1

          dispatch_code=99
          if [ -n "$workflow_id" ]; then
            echo >> "$output"
            echo '===== gh workflow run by numeric ID =====' >> "$output"
            dispatch_output=$(gh workflow run "$workflow_id" --ref main -f version='1.0.146' -f create_release=true 2>&1)
            dispatch_code=$?
            printf '%s\n' "$dispatch_output" >> "$output"
            echo "退出码：${dispatch_code}" >> "$output"

            sleep 12
            echo >> "$output"
            echo '===== gh run list by numeric workflow ID =====' >> "$output"
            run_output=$(gh run list --workflow "$workflow_id" --limit 10 --json databaseId,name,event,status,conclusion,headBranch,url,createdAt 2>&1)
            run_list_code=$?
            printf '%s\n' "$run_output" >> "$output"
            echo "退出码：${run_list_code}" >> "$output"

            run_id=$(printf '%s' "$run_output" | jq -r '[.[]? | select(.event == "workflow_dispatch" and .headBranch == "main")] | sort_by(.createdAt) | last | .databaseId // empty' 2>/dev/null)
            echo "解析到的正式发布运行 ID：${run_id:-无}" >> "$output"
            echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          fi

          echo "dispatch_code=${dispatch_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 发布诊断结果到 PR #2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/diagnose-report.md"
          {
            echo '## 1.0.146 发布诊断结果'
            echo
            echo "- 诊断运行 ID：${GITHUB_RUN_ID}"
            echo "- 正式发布运行 ID：${{ steps.diagnose.outputs.run_id }}"
            echo "- 发布触发退出码：${{ steps.diagnose.outputs.dispatch_code }}"
            echo
            echo '```text'
            tail -n 260 "${RUNNER_TEMP}/diagnose.txt"
            echo '```'
          } > "$report"
          gh pr comment 2 --body-file "$report"
          cat "$report"

      - name: 清理诊断工作流
        if: always()
        shell: bash
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/diagnose-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/diagnose-release.yml
          if git diff --cached --quiet; then
            echo '诊断工作流已被其他任务清理。'
            exit 0
          fi
          git commit -m 'CI：清理 1.0.146 发布诊断工作流'
          git push origin HEAD:main
