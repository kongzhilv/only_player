name: Agent playback speed patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/persist-manual-playback-speed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/persist-manual-playback-speed
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Apply narrowly scoped playback speed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt")
          text = path.read_text(encoding="utf-8")

          old = '''    private fun resolveTransitionPlaybackSpeed(
              transitionReason: Int,
              currentPlaybackSpeed: Float,
          ): Float = when (transitionReason) {
              Player.MEDIA_ITEM_TRANSITION_REASON_AUTO,
              Player.MEDIA_ITEM_TRANSITION_REASON_SEEK,
              -> currentPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> playerPreferences.defaultPlaybackSpeed

              else -> playerPreferences.defaultPlaybackSpeed
          }
          '''
          new = '''    private fun resolveTransitionPlaybackSpeed(
              transitionReason: Int,
              currentPlaybackSpeed: Float,
              storedPlaybackSpeed: Float?,
          ): Float = when (transitionReason) {
              Player.MEDIA_ITEM_TRANSITION_REASON_AUTO,
              Player.MEDIA_ITEM_TRANSITION_REASON_SEEK,
              -> currentPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> playerPreferences.defaultPlaybackSpeed

              else -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed
          }
          '''
          if old not in text:
              raise SystemExit("resolveTransitionPlaybackSpeed block not found")
          text = text.replace(old, new, 1)

          old = '''                        resolveTransitionPlaybackSpeed(
                              transitionReason = reason,
                              currentPlaybackSpeed = playbackParameters.speed,
                          ),
          '''
          new = '''                        resolveTransitionPlaybackSpeed(
                              transitionReason = reason,
                              currentPlaybackSpeed = playbackParameters.speed,
                              storedPlaybackSpeed = metadata.playbackSpeed,
                          ),
          '''
          if old not in text:
              raise SystemExit("transition speed call not found")
          text = text.replace(old, new, 1)

          old = '''                CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {
                      val playbackSpeed = args.getFloat(CustomCommands.PLAYBACK_SPEED_KEY)
                      val player = mediaSession?.player
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)
                      player.setPlaybackSpeed(playbackSpeed)
                      return@future SessionResult(SessionResult.RESULT_SUCCESS)
                  }
          '''
          new = '''                CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {
                      val playbackSpeed = args.getFloat(CustomCommands.PLAYBACK_SPEED_KEY)
                      val player = mediaSession?.player
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)
                      val currentMediaItem = player.currentMediaItem
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)

                      player.setPlaybackSpeed(playbackSpeed)
                      serviceScope.launch {
                          val playbackStateUri = playbackStateCoordinator.resolvePlaybackStateUri(currentMediaItem)
                          mediaRepository.updateMediumPlaybackSpeed(
                              uri = playbackStateUri,
                              playbackSpeed = playbackSpeed,
                          )
                      }
                      player.replaceMediaItem(
                          player.currentMediaItemIndex,
                          currentMediaItem.copy(playbackSpeed = playbackSpeed),
                      )
                      return@future SessionResult(SessionResult.RESULT_SUCCESS)
                  }
          '''
          if old not in text:
              raise SystemExit("persistent speed command block not found")
          text = text.replace(old, new, 1)

          old = '''                val positionMs = mediaItem.mediaMetadata.positionMs ?: videoState?.position
                  val durationMs = mediaItem.mediaMetadata.durationMs
          '''
          new = '''                val positionMs = mediaItem.mediaMetadata.positionMs ?: videoState?.position
                  val playbackSpeed = mediaItem.mediaMetadata.playbackSpeed ?: videoState?.playbackSpeed
                  val durationMs = mediaItem.mediaMetadata.durationMs
          '''
          if old not in text:
              raise SystemExit("media metadata state block not found")
          text = text.replace(old, new, 1)

          old = '''                                positionMs = positionMs,
                                  videoScale = videoScale,
          '''
          new = '''                                positionMs = positionMs,
                                  playbackSpeed = playbackSpeed,
                                  videoScale = videoScale,
          '''
          if old not in text:
              raise SystemExit("setExtras position block not found")
          text = text.replace(old, new, 1)

          old = '''import one.only.player.feature.player.extensions.positionMs
          import one.only.player.feature.player.extensions.remoteDirectoryPath
          '''
          new = '''import one.only.player.feature.player.extensions.playbackSpeed
          import one.only.player.feature.player.extensions.positionMs
          import one.only.player.feature.player.extensions.remoteDirectoryPath
          '''
          if old not in text:
              raise SystemExit("playbackSpeed import anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and check Kotlin
        shell: bash
        run: bash ./gradlew ktlintFormat ktlintCheck --warning-mode=fail

      - name: Run tests and compile Debug APK
        shell: bash
        run: bash ./gradlew test assembleDebug

      - name: Verify changed file scope
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -v -E '^feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt$|^\.github/workflows/agent-patch-speed.yml$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Remove one-time workflow and push verified patch
        shell: bash
        run: |
          rm .github/workflows/agent-patch-speed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist and restore manual playback speed"
          git push origin HEAD:agent/persist-manual-playback-speed
