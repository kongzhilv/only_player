name: 测试检查

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 准备构建信息
    runs-on: ubuntu-latest
    outputs:
      application_id: ${{ steps.app.outputs.application_id }}
      version_name: ${{ steps.app.outputs.version_name }}
      version_code: ${{ steps.app.outputs.version_code }}
      ref_name: ${{ steps.app.outputs.ref_name }}
      short_sha: ${{ steps.app.outputs.short_sha }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 读取应用信息
        id: app
        shell: bash
        run: |
          application_id=$(grep -m1 'applicationId = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_name=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')
          ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          short_sha=$(git rev-parse --short HEAD)

          if [ -z "$application_id" ] || [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo '::error::应用构建信息不完整'
            exit 1
          fi
          if [ "$application_id" != 'io.github.kongzhilv.onlyplayer' ]; then
            echo "::error::独立 fork 应用 ID 错误：$application_id"
            exit 1
          fi
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName 格式无效：$version_name"
            exit 1
          fi

          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: 输出预构建信息
        shell: bash
        run: |
          echo "应用 ID：${{ steps.app.outputs.application_id }}"
          echo "版本：${{ steps.app.outputs.version_name }} (${{ steps.app.outputs.version_code }})"
          echo "来源：${{ steps.app.outputs.ref_name }}"
          echo "提交：${{ steps.app.outputs.short_sha }}"

  verify:
    name: 格式、测试与构建检查
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 执行 Ktlint 与单元测试
        shell: bash
        run: ./gradlew ktlintCheck test --warning-mode=fail

      - name: 构建 arm64 Debug APK
        shell: bash
        run: python scripts/build.py build-apk --build-type debug --abi arm64-v8a --clean

      - name: 核验 Debug APK
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version_name }}'
          apk=$(find build/apk -maxdepth 1 -type f -name "*-debug-arm64-v8a-${version}.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo '::error::Debug APK 未生成'
            exit 1
          fi
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          package_name=$($aapt dump badging "$apk" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)
          if [ "$package_name" != 'io.github.kongzhilv.onlyplayer.debug' ]; then
            echo "::error::Debug APK 包名错误：$package_name"
            exit 1
          fi
          echo "Debug APK：$apk"

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports

  auto-release:
    name: 自动触发发布
    needs: [prepare, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 检查版本号和更新日志
        id: check
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version_name }}'
          tag="v${version}"

          if git tag -l "$tag" | grep -q .; then
            echo "标签 $tag 已存在，跳过发布"
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          if [ -n "$latest_tag" ]; then
            changelog_changed=$(git diff --name-only "$latest_tag" HEAD -- .github/CHANGELOG.md | wc -l)
          else
            changelog_changed=1
          fi

          if [ "$changelog_changed" -eq 0 ]; then
            echo '更新日志未变更，跳过发布'
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "版本 $version 待发布"
          echo 'should_release=true' >> "$GITHUB_OUTPUT"

      - name: 触发正式发布工作流
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version_name }}'
          gh workflow run publish.yaml --ref main -f version="$version" -f create_release=true

  verify-release-1-0-148:
    name: 核验 v1.0.148 正式资产与长期签名
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/verify-v1.0.148-via-test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 核验 Release 并回写结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          tag='v1.0.148'
          expected='b216ded82a850a9a55d885b8cbf1b8398bbd13b9c511fc3501f3595af89717b7'

          normalize() {
            tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]'
          }

          verify_release() {
            rm -rf /tmp/release-check
            mkdir -p /tmp/release-check
            gh release view "$tag" --repo "$repo" --json url,tagName,assets >/tmp/release.json 2>/dev/null || return 1

            [ "$(jq '[.assets[] | select(.name | contains("arm64-v8a") and endswith(".apk"))] | length' /tmp/release.json)" -eq 1 ] || return 1
            [ "$(jq '[.assets[] | select(.name | contains("x86_64") and endswith(".apk"))] | length' /tmp/release.json)" -eq 1 ] || return 1
            [ "$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' /tmp/release.json)" -eq 1 ] || return 1
            [ "$(jq '[.assets[] | select(.name == "SHA256-CERT-FINGERPRINT.txt")] | length' /tmp/release.json)" -eq 1 ] || return 1
            [ "$(jq '[.assets[] | select(.name == "only-player-fork-signing-certificate.pem")] | length' /tmp/release.json)" -eq 1 ] || return 1

            gh release download "$tag" --repo "$repo" \
              --pattern 'SHA256-CERT-FINGERPRINT.txt' \
              --dir /tmp/release-check --clobber >/dev/null
            published=$(normalize </tmp/release-check/SHA256-CERT-FINGERPRINT.txt)
            [ "$published" = "$expected" ]
          }

          for attempt in $(seq 1 60); do
            if verify_release; then
              break
            fi
            sleep 5
          done

          if ! verify_release; then
            gh pr comment "$PR_NUMBER" --repo "$repo" --body 'v1.0.148 Release 最终核验失败：资产不完整或长期签名指纹不一致。'
            exit 1
          fi

          release_url=$(jq -r '.url' /tmp/release.json)
          assets=$(jq -r '.assets[].name' /tmp/release.json | sed 's/^/- /')
          body=$(cat <<EOF
          ## v1.0.148 正式发行成功

          - Release：${release_url}
          - 应用 ID：io.github.kongzhilv.onlyplayer
          - versionCode：149
          - 长期签名 SHA-256：${expected}

          ### 已核验资产

          ${assets}

          双架构 APK、哈希清单、证书指纹与公开证书均已存在，签名与长期密钥一致。
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$repo" --body "$body"

          for branch in \
            agent/restore-list-last-played-highlight \
            agent/observe-v1.0.148-release \
            agent/retrigger-v1.0.148-observer
          do
            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}" || true
          done
