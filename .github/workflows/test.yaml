name: 测试检查

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 准备构建信息
    runs-on: ubuntu-latest
    outputs:
      application_id: ${{ steps.app.outputs.application_id }}
      version_name: ${{ steps.app.outputs.version_name }}
      version_code: ${{ steps.app.outputs.version_code }}
      ref_name: ${{ steps.app.outputs.ref_name }}
      short_sha: ${{ steps.app.outputs.short_sha }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 读取应用信息
        id: app
        shell: bash
        run: |
          application_id=$(grep -m1 'applicationId = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_name=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')
          ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          short_sha=$(git rev-parse --short HEAD)

          if [ -z "$application_id" ] || [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取应用信息"
            exit 1
          fi

          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName 格式无效：$version_name"
            echo "期望格式：x.y.z"
            exit 1
          fi

          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: 输出预构建信息
        shell: bash
        run: |
          echo "============================================"
          echo "📦 应用 ID:     ${{ steps.app.outputs.application_id }}"
          echo "🏷️ 版本名称:    ${{ steps.app.outputs.version_name }}"
          echo "🔢 版本号:      ${{ steps.app.outputs.version_code }}"
          echo "🌿 分支或来源:  ${{ steps.app.outputs.ref_name }}"
          echo "🧾 提交短哈希:  ${{ steps.app.outputs.short_sha }}"
          echo "============================================"

  verify:
    name: 格式化与代码检查
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 输出预构建信息
        shell: bash
        run: |
          echo "============================================"
          echo "📦 应用 ID:     ${{ needs.prepare.outputs.application_id }}"
          echo "🏷️ 版本名称:    ${{ needs.prepare.outputs.version_name }}"
          echo "🔢 版本号:      ${{ needs.prepare.outputs.version_code }}"
          echo "🌿 分支或来源:  ${{ needs.prepare.outputs.ref_name }}"
          echo "🧾 提交短哈希:  ${{ needs.prepare.outputs.short_sha }}"
          echo "============================================"

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 执行 Ktlint 格式化
        shell: bash
        run: bash ./gradlew ktlintFormat ktlintCheck --warning-mode=fail

      - name: 检查格式化结果
        shell: bash
        run: git diff --exit-code

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports

  finalize-speed-release:
    name: 整理并验证 1.0.146 发行候选
    needs: verify
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/persist-manual-playback-speed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出倍速修复分支
        uses: actions/checkout@v6
        with:
          ref: agent/persist-manual-playback-speed
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 写入最终倍速修复与发行信息
        shell: bash
        run: python3 scripts/finalize_speed_release.py

      - name: 格式化、测试并编译 Debug APK
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug --warning-mode=fail

      - name: 清理临时文件并恢复正式测试工作流
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/test.yaml
          rm -f .github/workflows/agent-finalize-release.yml
          rm -f scripts/finalize_speed_release.py

      - name: 审查最终修改范围
        shell: bash
        run: |
          allowed='^(app/build.gradle.kts|\.github/CHANGELOG.md|\.github/workflows/test.yaml|\.github/workflows/agent-finalize-release.yml|scripts/finalize_speed_release.py|core/data/src/main/java/one/only/player/core/data/repository/fake/FakeMediaRepository.kt|feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt|feature/player/src/main/java/one/only/player/feature/player/service/playback/PlaybackStateCoordinator.kt|feature/player/src/test/java/one/only/player/feature/player/service/playback/PlaybackStateCoordinatorTest.kt)$'
          unexpected=$(git diff --name-only | grep -v -E "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "发现超出允许范围的修改文件："
            echo "$unexpected"
            exit 1
          fi
          echo "最终修改范围检查通过。"

      - name: 提交发行候选
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "没有新的发行候选修改需要提交。"
            exit 0
          fi
          git commit -m '发行：完成 1.0.146 倍速修复与验证'
          git push origin HEAD:agent/persist-manual-playback-speed

  auto-release:
    name: 自动触发发布
    needs: [prepare, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 检查版本号和更新日志
        id: check
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version_name }}"
          tag="v${version}"

          if git tag -l "$tag" | grep -q .; then
            echo "标签 $tag 已存在，跳过发布"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$latest_tag" ]; then
            changelog_changed=$(git diff --name-only "$latest_tag" HEAD -- .github/CHANGELOG.md | wc -l)
          else
            changelog_changed=1
          fi

          if [ "$changelog_changed" -eq 0 ]; then
            echo "更新日志未变更，跳过发布"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "版本 $version 待发布，更新日志已更新"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: 直接触发发布工作流
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version_name }}"
          gh workflow run publish.yaml -f version="${version}" -f create_release=true
