name: 倍速持久化修复验证

run-name: 倍速持久化修复验证 · ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    name: 应用修复并完成验证
    if: github.head_ref == 'agent/persist-manual-playback-speed'
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@v6
        with:
          ref: agent/persist-manual-playback-speed
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 完成限定范围内的源码修复
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False

          speed_var_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == 'val playbackSpeed = mediaItem.mediaMetadata.playbackSpeed ?: videoState?.playbackSpeed'
          ]
          if len(speed_var_matches) != 1:
              raise SystemExit(f'播放速度恢复变量：期望命中 1 次，实际命中 {len(speed_var_matches)} 次')

          speed_var_index = speed_var_matches[0]
          position_arg_matches = [
              i for i in range(speed_var_index, len(lines))
              if lines[i].strip() == 'positionMs = positionMs,'
          ]
          if len(position_arg_matches) != 1:
              raise SystemExit(f'播放位置元数据参数：期望命中 1 次，实际命中 {len(position_arg_matches)} 次')

          position_arg_index = position_arg_matches[0]
          nearby = [line.strip() for line in lines[position_arg_index + 1:position_arg_index + 5]]
          if 'playbackSpeed = playbackSpeed,' not in nearby:
              indent = lines[position_arg_index][:len(lines[position_arg_index]) - len(lines[position_arg_index].lstrip())]
              lines.insert(position_arg_index + 1, indent + 'playbackSpeed = playbackSpeed,')
              changed = True

          end_of_resolver_matches = [
              i for i, line in enumerate(lines)
              if line.strip().startswith('private fun Player.isEndOfQueuePauseEnabled')
          ]
          if len(end_of_resolver_matches) != 1:
              raise SystemExit(f'队列结束判断函数：期望命中 1 次，实际命中 {len(end_of_resolver_matches)} 次')
          end_of_resolver_index = end_of_resolver_matches[0]
          if end_of_resolver_index > 0 and lines[end_of_resolver_index - 1].strip() != '':
              lines.insert(end_of_resolver_index, '')
              changed = True

          transient_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == 'CustomCommands.SET_TRANSIENT_PLAYBACK_SPEED -> {'
          ]
          if len(transient_matches) != 1:
              raise SystemExit(f'临时倍速命令：期望命中 1 次，实际命中 {len(transient_matches)} 次')
          transient_index = transient_matches[0]
          if transient_index > 0 and lines[transient_index - 1].strip() != '':
              lines.insert(transient_index, '')
              changed = True

          if changed:
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print('已补全倍速持久化恢复代码。')
          else:
              print('源码修复已存在，无需再次修改。')
          PY

      - name: 格式化并验证源码
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug

      - name: 检查修改文件范围
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -v '^feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt$' || true)
          if [ -n "$unexpected" ]; then
            echo '发现超出允许范围的修改文件：'
            echo "$unexpected"
            exit 1
          fi
          echo '修改范围检查通过。'

      - name: 提交已验证的源码修复
        shell: bash
        run: |
          if git diff --quiet; then
            echo '没有新的源码修改需要提交。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt
          git commit -m '修复：恢复已保存的播放倍速'
          git push origin HEAD:agent/persist-manual-playback-speed
