name: Apply playback speed persistence fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/persist-manual-playback-speed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/persist-manual-playback-speed
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Apply narrowly scoped source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          lines = path.read_text(encoding='utf-8').splitlines()

          def find_stripped(value: str, start: int = 0) -> int:
              matches = [i for i in range(start, len(lines)) if lines[i].strip() == value]
              if len(matches) != 1:
                  raise SystemExit(f'{value!r}: expected one match after {start}, got {len(matches)}')
              return matches[0]

          changed = False

          import_line = 'import one.only.player.feature.player.extensions.playbackSpeed'
          if import_line not in lines:
              idx = find_stripped('import one.only.player.feature.player.extensions.positionMs')
              lines.insert(idx, import_line)
              changed = True

          if not any('storedPlaybackSpeed: Float?' in line for line in lines):
              start = find_stripped('private fun resolveTransitionPlaybackSpeed(')
              end_candidates = [
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip().startswith('private fun Player.isEndOfQueuePauseEnabled')
              ]
              if len(end_candidates) != 1:
                  raise SystemExit(f'transition resolver end: expected one match, got {len(end_candidates)}')
              end = end_candidates[0]
              replacement = '''    private fun resolveTransitionPlaybackSpeed(
              transitionReason: Int,
              currentPlaybackSpeed: Float,
              storedPlaybackSpeed: Float?,
          ): Float = when (transitionReason) {
              Player.MEDIA_ITEM_TRANSITION_REASON_AUTO,
              Player.MEDIA_ITEM_TRANSITION_REASON_SEEK,
              -> currentPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> playerPreferences.defaultPlaybackSpeed

              else -> storedPlaybackSpeed ?: playerPreferences.defaultPlaybackSpeed
          }
          '''.splitlines()
              lines[start:end] = replacement
              changed = True

          if not any('storedPlaybackSpeed = metadata.playbackSpeed,' in line for line in lines):
              call_candidates = [
                  i for i, line in enumerate(lines)
                  if line.strip() == 'currentPlaybackSpeed = playbackParameters.speed,'
                  and any('resolveTransitionPlaybackSpeed(' in lines[j] for j in range(max(0, i - 4), i))
              ]
              if len(call_candidates) != 1:
                  raise SystemExit(f'transition resolver call: expected one match, got {len(call_candidates)}')
              idx = call_candidates[0]
              indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
              lines.insert(idx + 1, indent + 'storedPlaybackSpeed = metadata.playbackSpeed,')
              changed = True

          persistent_start = find_stripped('CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {')
          transient_start = find_stripped('CustomCommands.SET_TRANSIENT_PLAYBACK_SPEED -> {', persistent_start + 1)
          persistent_block = '\n'.join(lines[persistent_start:transient_start])
          if 'updateMediumPlaybackSpeed' not in persistent_block:
              replacement = '''                CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {
                      val playbackSpeed = args.getFloat(CustomCommands.PLAYBACK_SPEED_KEY)
                      val player = mediaSession?.player
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)
                      val currentMediaItem = player.currentMediaItem
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)

                      player.setPlaybackSpeed(playbackSpeed)
                      serviceScope.launch {
                          val playbackStateUri = playbackStateCoordinator.resolvePlaybackStateUri(currentMediaItem)
                          mediaRepository.updateMediumPlaybackSpeed(
                              uri = playbackStateUri,
                              playbackSpeed = playbackSpeed,
                          )
                      }
                      player.replaceMediaItem(
                          player.currentMediaItemIndex,
                          currentMediaItem.copy(playbackSpeed = playbackSpeed),
                      )
                      return@future SessionResult(SessionResult.RESULT_SUCCESS)
                  }
          '''.splitlines()
              lines[persistent_start:transient_start] = replacement
              changed = True

          if not any('val playbackSpeed = mediaItem.mediaMetadata.playbackSpeed ?: videoState?.playbackSpeed' in line for line in lines):
              title_idx = find_stripped('val title = mediaItem.mediaMetadata.title ?: video?.nameWithExtension ?: getFilenameFromUri(uri)')
              position_candidates = [
                  i for i in range(title_idx + 1, min(title_idx + 8, len(lines)))
                  if lines[i].strip() == 'val positionMs = mediaItem.mediaMetadata.positionMs ?: videoState?.position'
              ]
              if len(position_candidates) != 1:
                  raise SystemExit(f'restored speed variable: expected one match, got {len(position_candidates)}')
              idx = position_candidates[0]
              indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
              lines.insert(idx + 1, indent + 'val playbackSpeed = mediaItem.mediaMetadata.playbackSpeed ?: videoState?.playbackSpeed')
              changed = True

          if not any(line.strip() == 'playbackSpeed = playbackSpeed,' for line in lines):
              title_idx = find_stripped('val title = mediaItem.mediaMetadata.title ?: video?.nameWithExtension ?: getFilenameFromUri(uri)')
              position_arg_candidates = [
                  i for i in range(title_idx, len(lines))
                  if lines[i].strip() == 'positionMs = positionMs,'
              ]
              if len(position_arg_candidates) != 1:
                  raise SystemExit(f'restored speed metadata: expected one match, got {len(position_arg_candidates)}')
              idx = position_arg_candidates[0]
              indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
              lines.insert(idx + 1, indent + 'playbackSpeed = playbackSpeed,')
              changed = True

          if changed:
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          else:
              print('Source fix already present.')
          PY

      - name: Format and verify source
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug

      - name: Verify changed scope
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -v '^feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected changed files:'
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt
          git commit -m 'fix: persist and restore manual playback speed'
          git push origin HEAD:agent/persist-manual-playback-speed
