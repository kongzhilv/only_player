name: Apply audio focus live-settings patch

on:
  push:
    branches:
      - fix/audio-focus-live-settings
    paths:
      - '.github/workflows/audio-focus-live-settings-patch.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/audio-focus-live-settings
          fetch-depth: 0

      - name: Configure JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Apply exact PlayerService patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          text = path.read_text()
          anchor = "        audioEffectsCoordinator.applyVolumeNormalization(playerPreferences.isVolumeNormalizationEnabled)\n"
          lines = [
              "        serviceScope.launch {",
              "            preferencesRepository.playerPreferences",
              "                .distinctUntilChanged { old, new ->",
              "                    old.shouldRequireAudioFocus == new.shouldRequireAudioFocus &&",
              "                        old.shouldPauseOnHeadsetDisconnect == new.shouldPauseOnHeadsetDisconnect",
              "                }",
              "                .collect { preferences ->",
              "                    val player = mediaSession?.player as? ExoPlayer ?: return@collect",
              "                    player.setAudioAttributes(",
              "                        AudioAttributes.Builder()",
              "                            .setUsage(C.USAGE_MEDIA)",
              "                            .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)",
              "                            .build(),",
              "                        preferences.shouldRequireAudioFocus,",
              "                    )",
              "                    player.setHandleAudioBecomingNoisy(preferences.shouldPauseOnHeadsetDisconnect)",
              "                    Logger.info(",
              "                        TAG,",
              "                        \"Applied audio behavior requireFocus=${preferences.shouldRequireAudioFocus} pauseOnHeadsetDisconnect=${preferences.shouldPauseOnHeadsetDisconnect}\",",
              "                    )",
              "                }",
              "        }",
          ]
          insertion = "\n".join(lines) + "\n" + anchor

          if text.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one PlayerService anchor, found {text.count(anchor)}')
          if 'Applied audio behavior requireFocus=' in text:
              raise SystemExit('PlayerService patch already present')

          path.write_text(text.replace(anchor, insertion))
          PY

          git diff --check

      - name: Format and verify business change
        shell: bash
        run: |
          ./gradlew ktlintFormat ktlintCheck test --warning-mode=fail

      - name: Remove one-shot patch workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/audio-focus-live-settings-patch.yaml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply audio focus preferences immediately'
          git push origin HEAD:fix/audio-focus-live-settings
