name: PR #2 倍速修复最终收尾

run-name: PR #2 倍速修复最终收尾

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-pr2-speed-release
  cancel-in-progress: false

jobs:
  finish:
    name: 修正代码、完整验证并更新 PR
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/finalize-speed-release'
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 修复分支
        uses: actions/checkout@v6
        with:
          ref: agent/finalize-speed-release
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: 写入最终倍速修复
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt')
          text = path.read_text(encoding='utf-8')

          function_start = text.find('    private fun resolveTransitionPlaybackSpeed(')
          function_end = text.find('    private fun Player.persistedPlaybackSpeedOrDefault()', function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit('未能定位播放切换倍速函数。')

          transition_function = '''    private fun resolveTransitionPlaybackSpeed(
              transitionReason: Int,
              currentPlaybackSpeed: Float,
              storedPlaybackSpeed: Float?,
          ): Float = when (transitionReason) {
              Player.MEDIA_ITEM_TRANSITION_REASON_AUTO,
              Player.MEDIA_ITEM_TRANSITION_REASON_SEEK,
              -> currentPlaybackSpeed

              Player.MEDIA_ITEM_TRANSITION_REASON_PLAYLIST_CHANGED,
              Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT,
              -> storedPlaybackSpeed ?: currentPlaybackSpeed

              else -> storedPlaybackSpeed ?: currentPlaybackSpeed
          }

          '''
          text = text[:function_start] + transition_function + text[function_end:]

          command_start = text.find('                CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {')
          command_end = text.find('                CustomCommands.SET_TRANSIENT_PLAYBACK_SPEED -> {', command_start)
          if command_start < 0 or command_end < 0:
              raise SystemExit('未能定位持久倍速命令代码块。')

          persistent_command = '''                CustomCommands.SET_PERSISTENT_PLAYBACK_SPEED -> {
                      val playbackSpeed = args.getFloat(CustomCommands.PLAYBACK_SPEED_KEY)
                      val player = mediaSession?.player
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)
                      val currentMediaItem = player.currentMediaItem
                          ?: return@future SessionResult(SessionError.ERROR_BAD_VALUE)
                      val playbackStateUri = playbackStateCoordinator.resolvePlaybackStateUri(currentMediaItem)

                      mediaRepository.updateMediumPlaybackSpeed(
                          uri = playbackStateUri,
                          playbackSpeed = playbackSpeed,
                      )
                      player.setPlaybackSpeed(playbackSpeed)
                      player.replaceMediaItem(
                          player.currentMediaItemIndex,
                          currentMediaItem.copy(playbackSpeed = playbackSpeed),
                      )
                      return@future SessionResult(SessionResult.RESULT_SUCCESS)
                  }

          '''
          text = text[:command_start] + persistent_command + text[command_end:]
          path.write_text(text, encoding='utf-8')
          print('已完成倍速保存竞态和切换回退修复。')
          PY

      - name: 恢复正式发布链并清理重复工作流
        shell: bash
        run: |
          git checkout 23ce56838ad14e19073726045cda88e86e6d9d24 -- .github/workflows/test.yaml
          rm -f .github/workflows/release-1.0.146.yml
          rm -f .github/workflows/finalize-speed-release.yml
          echo '已恢复正式 test.yaml + publish.yaml，并移除临时或重复工作流。'

      - name: 格式化、测试并编译 Debug APK
        shell: bash
        run: |
          bash ./gradlew ktlintFormat
          bash ./gradlew ktlintCheck test assembleDebug --warning-mode=fail

      - name: 审查最终修改范围
        shell: bash
        run: |
          allowed='^(feature/player/src/main/java/one/only/player/feature/player/service/PlayerService.kt|\.github/workflows/test.yaml|\.github/workflows/release-1.0.146.yml|\.github/workflows/finalize-speed-release.yml)$'
          unexpected=$(git diff --name-only | grep -v -E "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo '发现超出允许范围的修改文件：'
            echo "$unexpected"
            exit 1
          fi
          echo '最终修改范围检查通过。'

      - name: 提交并推送 PR 发行候选
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修复：完成倍速持久化与发行流程收尾'
          git push origin HEAD:agent/finalize-speed-release

      - name: 清理主分支一次性收尾工作流
        if: always()
        shell: bash
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/finish-pr2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finish-pr2.yml
          if git diff --cached --quiet; then
            echo '一次性工作流已被其他任务清理。'
            exit 0
          fi
          git commit -m 'CI：清理 PR #2 一次性收尾工作流'
          git push origin HEAD:main
