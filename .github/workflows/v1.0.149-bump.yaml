name: Prepare v1.0.149 version bump

on:
  push:
    branches:
      - release/v1.0.149
    paths:
      - '.github/workflows/v1.0.149-bump.yaml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.149
          fetch-depth: 0

      - name: Configure JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Update version catalog
        shell: bash
        run: |
          ./gradlew versionCatalogUpdate
          for key in android-compileSdk android-targetSdk android-minSdk android-jvm; do
            grep -q "^${key} =" gradle/libs.versions.toml || {
              echo "Missing required custom version key: ${key}" >&2
              exit 1
            }
          done
          unexpected="$(git diff --name-only | grep -v '^gradle/libs\.versions\.toml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "versionCatalogUpdate changed unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Verify and commit catalog updates if present
        shell: bash
        run: |
          if ! git diff --quiet -- gradle/libs.versions.toml; then
            ./gradlew ktlintCheck test --warning-mode=fail
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gradle/libs.versions.toml
            git commit -m 'chore: update version catalog before v1.0.149'
          fi

      - name: Bump version and write changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app/build.gradle.kts')
          text = app.read_text()
          old = '        versionCode = 149\n        versionName = "1.0.148"'
          new = '        versionCode = 150\n        versionName = "1.0.149"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one version block, found {text.count(old)}')
          app.write_text(text.replace(old, new))

          changelog = '''- 让“获取音频焦点”和“拔出耳机时暂停”在播放过程中修改后立即生效，无需重启播放器
- 关闭“获取音频焦点”后，可更稳定地与网易云音乐等媒体应用同时播放，减少对方切换歌曲时视频因音频焦点变化被暂停

<details>
<summary>English Version</summary>

- Apply “Audio focus” and “Pause on headset disconnect” changes immediately during playback without restarting the player
- Improve simultaneous playback with media apps such as NetEase Cloud Music when audio focus is disabled, reducing video pauses when the other app changes tracks

</details>'''
          Path('.github/CHANGELOG.md').write_text(changelog)
          PY
          rm .github/workflows/v1.0.149-bump.yaml
          git diff --check

      - name: Verify version bump
        shell: bash
        run: |
          ./gradlew ktlintFormat ktlintCheck test --warning-mode=fail
          grep -q 'versionCode = 150' app/build.gradle.kts
          grep -q 'versionName = "1.0.149"' app/build.gradle.kts
          grep -q '获取音频焦点' .github/CHANGELOG.md
          test ! -e .github/workflows/v1.0.149-bump.yaml
          git diff --check

      - name: Commit version and changelog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: bump version to 1.0.149 and update changelog'
          git push origin HEAD:release/v1.0.149
